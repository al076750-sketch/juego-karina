<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="app.css">
  <title>Karina escapa de Beyoncé</title>
</head>
<body>

  <header>
    <h1>KARINA ESCAPA DE BEYONCÉ</h1>
  </header>

  <main class="contenedor">
    <section class="juego">
      <div id="game-area">
        <div id="player" class="character"></div>
        <div id="beyonce" class="character"></div>
        <div id="paolaCanta"></div>
        
        <!-- Aquí salen los mensajes flotantes -->
        <div id="mensaje-flotante"></div>

        <div id="escena" class="capa">
          <video id="clipCorre" src="karina-corre.mp4" muted playsinline></video>
          <p id="escenaTexto"></p>
          <button id="btnSaltar" class="chico">Saltar intro ⏭</button>
        </div>

        <div id="victoria" class="capa">
          <h2>¡KARINA ESCAPÓ!</h2>
          <video id="clipCamina" src="karina-camina.mp4" muted loop playsinline></video>
          <p>Beyoncé se quedó haciendo el quehacer 🧹<br>Sobreviviste <b id="vicTiempo">0</b> s</p>
          <button id="btnJugarOtra">Jugar otra vez</button>
        </div>

        <div id="gameover" class="capa">
          <div id="fotoGameover"></div>
          <h2>Ups, me atrapó la mugrosa</h2>
          <button id="btnReintentar">Intentar de nuevo</button>
        </div>
      </div>

      <button id="btnIniciar">▶ Iniciar</button>
    </section>

    <div id="panel-wrapper">
      <button id="panel-toggle" aria-expanded="false">
        <span>⚙ Configuración</span>
        <span class="flecha">▼</span>
      </button>
      <div id="panel">
        <h2>Opciones del juego</h2>

        <label>Velocidad de Karina: <b id="valJugador">5</b>
          <input type="range" id="velJugador" min="2" max="12" value="5">
        </label>
        <label>Velocidad de Beyoncé: <b id="valBeyonce">2</b>
          <input type="range" id="velBeyonce" min="1" max="8" step="0.5" value="2">
        </label>
        <label>Segundos para ganar: <b id="valMeta">60</b>
          <input type="range" id="metaTiempo" min="20" max="120" step="5" value="60">
        </label>
        <label>Duración del quehacer (seg): <b id="valQuehacer">4</b>
          <input type="range" id="duracionQuehacer" min="1" max="10" value="4">
        </label>
        <label>Duración del baile (seg): <b id="valBaile">5</b>
          <input type="range" id="duracionBaile" min="2" max="12" value="5">
        </label>
        <label>Fondo del área:
          <select id="fondo"></select>
        </label>
        <label class="fila"><input type="checkbox" id="verClips" checked> Mostrar clips de Karina</label>
        <label class="fila"><input type="checkbox" id="risaOn" checked> Risa de Paola (Sonido)</label>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
